<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/svg" href="imges/pagelines-brands-solid (1).png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>register</title>
</head>
<body>
    <header class="flex-col md:flex-row py-3 gap-4">
        <div class="logo-head"><a href="index.html"><img src="imges/plant-logo.png" alt="logo"></a></div>
        <div class="head-parent">
            <ul class="links">
                <li class="login"><a href="login.html">login</a></li>
                <li class="register"><a href="register.html">register</a></li>
            </ul>
        </div>
    </header>
    <main class="m-register">
        <form action="register.html" class="form for-register" id="registerForm">
            <div class="names">
                <div class="input-group">
                    <input type="text" name="userFname" id="userFname" placeholder=" " required>
                    <label for="userFname">First name</label>
                </div>
                <div class="input-group">
                    <input type="text" name="userLname" id="userLname" placeholder=" " required>
                    <label for="userLname">Last name</label>
                </div>
            </div><!--names-->
            <div class="input-group">
                <input type="email" name="email" id="email" placeholder=" " required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="logbtn" id="sing_up">Sign Up</button>
            <h3>Have an account? <a href="login.html">Sign In</a></h3>
        </form>
    </main>
    <script src="js/register.js"></script>
</body>
</html>
