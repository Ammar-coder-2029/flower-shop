<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/svg" href="imges/pagelines-brands-solid.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
</head>
<body>
    <header class="flex-col md:flex-row py-3 gap-4">
        <div class="logo-head"><a href="index.html"><img src="imges/plant-logo.png" alt="logo"></a></div>
        <div class="head-parent">
            <ul class="links">
                <li class="login"><a href="login.html">login</a></li>
                <li class="register"><a href="register.html">register</a></li>
            </ul>
            <ul class="user-info">
                <li class="user cursor-pointer">Hello, </li>
                <li class="cart cursor-pointer flex relative gap-x-2 " id="cart">
                    <div class="pop-list backdrop-blur-3xl w-46 bg-gray-200" id="pop-list">
                        <div id="pop-list-items">
                            
                        </div>
                        <div class="bg-white/60 backdrop-blur-3xl rounded-lg border-2 p-1 gap-y-[20px]">
                            <h3 class="text-center"><a href="cart.html">View All Product</a></h3>
                        </div>
                    </div>
                    <p>
                        <i class="fa-solid fa-cart-shopping leading-7" id="cart-icon"></i>
                        <span class="text-center" id="counter" ></span>
                    </p>
                </li>
                <li class="logout" id="logout"><a href="">logout</a></li>
            </ul>
        </div>
    </header>
    <main class="m-main">
        <section class="search flex-col md:flex-row">
            <select id="selector" title="type of search" class="w-full md:w-[30%]">
                <option value="title" id="s-title">search by title</option>
                <option value="type" id="s-type">search by catigory</option>
            </select>
            <input type="text" name="text" id="search-input" placeholder="Search..." class="w-full md:w-[50%]">
            <button type="submit" class="w-full md:w-[10%]">search</button>
        </section>
        <section class="products">
            
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
