<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/svg" href="imges/plant-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>cart</title>
</head>
<body>
    <header class="flex-col md:flex-row py-3 gap-4">
        <div class="logo-head"><a href="index.html"><img src="imges/plant-logo.png" alt="logo"></a></div>
        <div class="head-parent">
            <ul class="links">
                <li class="login"><a href="login.html">login</a></li>
                <li class="register"><a href="register.html">register</a></li>
            </ul>
            <ul class="user-info">
                <li class="user cursor-pointer">Hello, </li>
                <li class="cart cursor-pointer flex relative gap-x-2" id="cart">
                    <div class="pop-list backdrop-blur-3xl w-46" id="pop-list">
                        <div id="pop-list-items">
                            
                        </div>
                        <div class="bg-white/60 backdrop-blur-3xl rounded-lg border-2 p-1 gap-y-[20px]">
                            <h3 class="text-center"><a href="cart.html">View All Product</a></h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-cart-shopping leading-7" id="cart-icon"></i>
                    <span class="text-center" id="counter" ></span>
                </li>
                <li class="logout" id="logout"><a href="">logout</a></li>
            </ul>
        </div>
    </header>
    <main class="m-cart">
        <section class="itemsincart border-b-2 w-full flex flex-col items-center justify-center">
            <div class="productsCart">
                <div class="productCart h-fit md:h-[250px]">
                    <div class="img-container imgConCart">
                        <img src="imges/redMBW.jpg" alt="img of product">
                    </div>
                    <div class="disc-prod">
                        <h1>h22222</h1>
                        <h4 class="catigory">catigory:caaaaaa</h4>
                        <h4 class="price">price:1000</h4>
                        <div class="action">
                            <span class="" id="counter"></span>
                            <button type="submit" class="" id="remove-from-cart">remove to cart</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pb-3">
                <h2 class="text-3xl font-bold text-center" id="totalprice" >TotalPrice:$00.00</h2>
            </div>
        </section>
        <section class="favourt w-full">
            <div class="fav-header group w-full flex flex-col items-center">
                <h1 class="text-center text-4xl text-black font-bold">favourite list</h1>
                <div class="line w-48 h-[3px] bg-green-600 group-hover:w-96 transition-all ease-in-out duration-300 rounded-lg"></div>
            </div>
            <section class="favproducts w-full h-fit pt-4 flex items-center justify-center" id="favproducts">
                <div class="favContainer h-fit w-[90%] flex flex-wrap justify-center gap-6 items-center">
                    
                </div>
            </section>
        </section>
    </main>
    <script src="js/cart.js"></script>
</body>
</html>
